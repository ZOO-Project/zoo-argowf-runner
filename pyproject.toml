[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoo-argowf-runner"
description = "ZOO-Projecr runner using Argo Workflows to process an Application Package encoded in CWL."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
keywords = ["zoo-project", "cwl", "argo-workflows", "eoepca", "workflow"]
authors = [
    { name = "ZOO-Project" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "zoo-runner-common",
    "PyYAML",
    "hera",
    "cwl-utils",
    "click",
    "cwl-utils>=0.14",
    "attrs",
    "loguru"
]

[project.urls]
Homepage = "https://github.com/ZOO-Project/zoo-argowf-runner"
Repository = "https://github.com/ZOO-Project/zoo-argowf-runner"
Documentation = "https://github.com/ZOO-Project/zoo-argowf-runner#readme"

[tool.hatch.version]
path = "zoo_argowf_runner/__about__.py"

[tool.hatch.envs.default]
dependencies = [
    "zoo-runner-common",
    "PyYAML",
    "hera",
    "cwl-utils",
    "click",
    "cwl-utils>=0.14",
    "attrs",
    "loguru"
]

[tool.hatch.envs.test]
dependencies = [
    "zoo-runner-common",
    "pytest",
    "pytest-cov",
    "PyYAML",
    "hera",
    "cwl-utils",
    "click",
    "cwl-utils>=0.14",
    "attrs",
    "loguru"
]

[tool.hatch.envs.test.scripts]
test = "pytest {args}"
test-q = "pytest -q {args}"